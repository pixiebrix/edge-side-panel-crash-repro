name: Repro

on:
  push:
  workflow_dispatch:
    inputs:
      iterations:
        description: Side panel opens per job
        default: "30"

jobs:
  repro:
    name: repro (${{ matrix.channel }} ${{ matrix.edge_version || 'latest' }} ${{ matrix.job }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The crash was captured on 154.0.4258.37; pin it, and keep one job on the latest build
          - { channel: msedge, edge_version: "154.0.4258.37-1", job: 1 }
          - { channel: msedge, edge_version: "154.0.4258.37-1", job: 2 }
          - { channel: msedge, edge_version: "154.0.4258.37-1", job: 3 }
          - { channel: msedge, job: 4 }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Install Microsoft Edge (stable)
        if: matrix.channel == 'msedge'
        run: npx playwright install --with-deps msedge
      - name: Pin the Microsoft Edge build
        if: matrix.edge_version
        run: |
          apt-get install -y --allow-downgrades "microsoft-edge-stable=${EDGE_VERSION}"
          /opt/microsoft/msedge/msedge --version
        env:
          EDGE_VERSION: ${{ matrix.edge_version }}
      # Branded Chrome no longer loads unpacked extensions from the command line; Chrome for
      # Testing is the same stable version and still does
      - name: Install Chrome for Testing (stable)
        if: matrix.channel == 'chrome'
        shell: bash
        run: |
          set -euo pipefail
          apt-get update && apt-get install -y unzip
          npx playwright install-deps chromium
          path=$(npx -y @puppeteer/browsers install chrome@stable --path /opt/cft | awk '{print substr($0, index($0, " ") + 1)}')
          test -x "${path}"
          echo "BROWSER_PATH=${path}" >> "$GITHUB_ENV"
      - name: Run the reproduction
        run: |
          set +e
          xvfb-run --auto-servernum node repro/run.mjs "${ITERATIONS}" "${CHANNEL}"
          code=$?
          echo "StackChildLayerRelativeTo warnings: $(grep -c StackChildLayerRelativeTo browser.log)"
          grep -E "FATAL|Check failed|Received signal" browser.log | head -20
          exit $code
        env:
          ITERATIONS: ${{ inputs.iterations || '30' }}
          CHANNEL: ${{ matrix.channel }}
          EDGE_LOGGING: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-log-${{ matrix.channel }}-${{ matrix.edge_version || 'latest' }}-${{ matrix.job }}
          path: browser.log
